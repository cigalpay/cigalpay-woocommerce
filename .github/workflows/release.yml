# Pushing a tag vX.Y.Z builds cigalpay-for-woocommerce.zip and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -E '^\s*\*\s*Version:' cigalpay-for-woocommerce.php | awk '{print $NF}')
          constant=$(grep -oP "CIGALPAY_WC_VERSION', '\K[^']+" cigalpay-for-woocommerce.php)
          stable=$(grep -m1 '^Stable tag:' readme.txt | awk '{print $NF}')
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          [ "$tag" = "$header" ] && [ "$tag" = "$constant" ] && [ "$tag" = "$stable" ] || {
            echo "::error::Tag v$tag doesn't match the plugin version (header $header, CIGALPAY_WC_VERSION $constant, readme Stable tag $stable)"
            exit 1
          }

      - name: Build the zip
        run: |
          mkdir -p build/cigalpay-for-woocommerce
          rsync -a --exclude .git --exclude .github --exclude .wordpress-org --exclude build --exclude README.md ./ build/cigalpay-for-woocommerce/
          cd build && zip -qr cigalpay-for-woocommerce.zip cigalpay-for-woocommerce
          unzip -l cigalpay-for-woocommerce.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 == "= " v " =" {on=1; next} /^= / {on=0} on && NF' readme.txt)
          gh release create "$GITHUB_REF_NAME" build/cigalpay-for-woocommerce.zip \
            --title "${GITHUB_REF_NAME#v}" \
            --notes "${notes:-Release ${GITHUB_REF_NAME#v}.}"
